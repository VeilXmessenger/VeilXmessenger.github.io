<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Veil</title>
    <!--
      GitHub Pages SPA routing trick.
      When GitHub Pages serves a 404 for a deep link, this page encodes the
      full path into sessionStorage and redirects to index.html, which then
      restores it via history.replaceState so the React router sees the correct URL.
    -->
    <script>
      sessionStorage.setItem("spa_redirect", location.pathname + location.search + location.hash);
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
